# --- Grafana Configuration ---
grafana:
  enabled: true

  # Admin credentials are read from a Kubernetes Secret created out-of-band
  # (see README "Create the Grafana Admin Secret"), so no password is committed here.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    type: pvc
    size: 10Gi

# --- Prometheus Configuration ---
prometheus:
  enabled: true
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

# --- Alertmanager Section (Enabled) ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi