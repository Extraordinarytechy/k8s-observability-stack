# --- Grafana Configuration ---
grafana:
  enabled: true
  adminPassword: "REDACTED"

  persistence:
    enabled: true
    type: pvc
    size: 10Gi

# --- Prometheus Configuration ---
prometheus:
  enabled: true
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

# --- Alertmanager Section (Enabled) ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi