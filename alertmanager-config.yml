global:
  resolve_timeout: 5m
  slack_api_url: 'your-slack-webhook-url'

route:
  group_by: ['job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'ops'

receivers:
  - name: 'ops'
    slack_configs:
      - channel: '#cluster-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
