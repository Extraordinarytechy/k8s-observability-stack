    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: test-slack-alert
      namespace: monitoring
      labels:
        release: prometheus
    spec:
      groups:
      - name: slack-test
        rules:
        - alert: TestSlackAlert
          expr: vector(1)
          for: 10s
          labels:
            severity: test
          annotations:
            summary: "This is a test alert for Slack!"
            description: "If you see this, Alertmanager is correctly configured."